<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Clean Island Power Washing</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css?v={{V}}">
<style>
  body { background: var(--fog); }
  .a-top { background: var(--harbor); color: #fff; }
  .a-top .wrap { display: flex; align-items: center; gap: 1rem; height: 64px; }
  .a-top b { font: 800 1.1rem var(--display); font-stretch: 118%; margin-right: auto; }
  .a-top button { color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: .45rem .9rem; cursor: pointer; font: 600 .9rem var(--body); }
  .tabs { display: flex; gap: .25rem; overflow-x: auto; border-bottom: 1px solid var(--line); background: #fff; }
  .tabs button { border: 0; background: none; padding: 1rem 1.1rem; font: 650 .95rem var(--body); color: var(--slate); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--harbor); border-color: var(--bay); }
  .panel { padding-block: 1.5rem 4rem; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  .toolbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  .toolbar select, .toolbar input { width: auto; min-width: 160px; }
  table.a { width: 100%; border-collapse: collapse; font-size: .93rem; background: #fff; }
  table.a th, table.a td { padding: .7rem .6rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.a th { font-size: .8rem; color: var(--slate); }
  table.a tr.click { cursor: pointer; } table.a tr.click:hover td { background: #F6FAFF; }
  table.a input, table.a select { min-height: 38px; padding: .35rem .5rem; font-size: .9rem; }
  .pill { display: inline-block; padding: .15rem .55rem; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--foam); color: var(--bay-dark); }
  .pill.requested, .pill.approved, .pill.pending_payment, .pill.completed { background: #FFF1D6; color: var(--warn); }
  .pill.confirmed, .pill.paid { background: #E8F6EE; color: var(--ok); }
  .pill.rejected, .pill.cancelled, .pill.expired { background: #F1F3F6; color: var(--slate); }
  dialog { border: 0; border-radius: 14px; padding: 0; width: min(860px, 96vw); max-height: 92vh; box-shadow: 0 30px 80px -20px rgba(8,27,48,.6); }
  dialog::backdrop { background: rgba(8,27,48,.55); }
  .dlg-head { position: sticky; top: 0; background: #fff; display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); z-index: 2; }
  .dlg-body { padding: 1.25rem; }
  .acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .75rem; }
  .acts .card { margin: 0; }
  .acts h4 { font-size: 1rem; margin-bottom: .6rem; }
  .btn.sm { min-height: 40px; padding: .5rem .9rem; font-size: .9rem; }
  .muted { color: var(--slate); font-size: .88rem; }
  .photos { display: flex; gap: .5rem; flex-wrap: wrap; } .photos img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; }
  .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--harbor); color: #fff; padding: .8rem 1.2rem; border-radius: 8px; z-index: 99; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
  .day { display: grid; grid-template-columns: 150px 1fr; gap: 1rem; padding: .7rem 0; border-bottom: 1px solid var(--line); }
  .day.closed { opacity: .45; }
</style>
</head>
<body>
<div id="app"><div class="narrow" style="padding:4rem 0"><p>Loading admin&hellip;</p></div></div>
<script type="module" src="/assets/js/admin.js?v={{V}}"></script>
</body>
</html>
